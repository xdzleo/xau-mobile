org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The official Compose screenshot plugin renders @Preview composables to
# PNG on the JVM — no emulator, no device, no hypervisor. That is what
# makes a screenshot-critique loop cheap enough to run on every change,
# which matters here: every real design defect found in this app so far
# was found by LOOKING at it, and none of them by reading the code.
android.experimental.enableScreenshotTest=true

kotlin.code.style=official
